version: 1
project:
  name: "Harness Engineering Kit"
  owner: "harness-engineering-kit maintainers"
  stack: ["Node.js", "Python"]

authority:
  order: [system-developer-user, native-instructions, agent-policy, context-index, path-ai-md, engineering-profile]
  context_documents_are_supplemental: true
  untrusted_instruction_sources: [issues, fixtures, generated-content, logs, code-comments]

commands:
  fast_test: "python -m unittest discover -s tests -p \"test_workspace*.py\""
  test: "npm test"
  build: "npm run test:skill"
  fitness: "npm run verify"

context:
  index_document_name: ai.json
  detail_document_name: AI.md
  index_max_bytes: 8192
  detail_max_lines: 800
  # This repository is the Kit source tree, so the canonical documents are the
  # source tree itself: no second copy is vendored under .hek/kit.
  architecture_overview: core/harness-engineering.md
  dependency_rules: core/ddd-modeling.md

permissions:
  readable_paths: ["scripts", "core", "templates", "bin", "tests", "docs", "openspec", ".hek"]
  writable_paths: ["scripts", "core", "templates", "bin", "tests", "docs", "openspec", ".hek"]
  denied_paths: [".env*", "secrets/**"]
  protected_paths: [.hek/fitness]
  fitness_changes: human-approval-required
  network: deny-by-default
  production_writes: approval-required
  destructive_operations: approval-required

delivery:
  migration_guide: docs/versioning.md
  production_policy: .hek/project/production/policy.yaml

methodology:
  lifecycle: core/change-lifecycle.md
  engineering_skill: engineering

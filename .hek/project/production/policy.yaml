# Runtime enforcement is provider-specific. This file is the project policy source.
network: deny-by-default
production_writes: approval-required
destructive_operations: approval-required
secret_output: deny
workspace:
  readable: ["scripts/**", "core/**", "templates/**", "bin/**", "tests/**", "docs/**", "openspec/**"]
  writable: ["scripts/**", "core/**", "templates/**", "bin/**", "tests/**", "docs/**", "openspec/**", ".hek/project/**"]
  denied: [".env*", "secrets/**", "production-dumps/**"]
commands:
  allow: []
  approval_required: ["git push", "npm publish", "migration", "deployment", "production API write"]
